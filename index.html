<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Genie TV 설정</title>

<style>
body {
    margin: 0;
    padding: 25px 15px 50px;
    background: #111;
    color: white;
    font-family: sans-serif;
    text-align: center;
}

h1 {
    font-size: 28px;
    margin-bottom: 8px;
}

p {
    color: #aaa;
    margin-bottom: 25px;
}

a {
    display: block;
    width: 90%;
    max-width: 520px;
    margin: 12px auto;
    padding: 18px;
    box-sizing: border-box;

    background: white;
    color: black;

    text-decoration: none;
    border-radius: 12px;

    font-size: 19px;
    font-weight: bold;
}

a:focus {
    outline: 4px solid #00aaff;
    transform: scale(1.03);
}
</style>
</head>

<body>

<h1>📺 Genie TV 설정</h1>
<p>TV Bro에서 원하는 설정을 선택하세요.</p>


<!-- 전체 설정 -->

<a href="intent://settings/#Intent;action=android.settings.SETTINGS;package=com.android.tv.settings;end">
⚙️ 전체 설정
</a>


<!-- 앱 -->

<a href="intent://applications/#Intent;action=android.settings.MANAGE_APPLICATIONS_SETTINGS;package=com.android.tv.settings;end">
📱 설치된 앱 목록
</a>


<a href="intent://applications/#Intent;action=android.settings.APPLICATION_SETTINGS;package=com.android.tv.settings;end">
📱 앱 설정
</a>


<!-- 저장공간 -->

<a href="intent://storage/#Intent;action=android.settings.INTERNAL_STORAGE_SETTINGS;package=com.android.tv.settings;end">
