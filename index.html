<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Genie TV 설정 테스트</title>

<style>
body {
    margin: 0;
    padding: 30px 15px;
    background: #111;
    color: white;
    font-family: sans-serif;
    text-align: center;
}

h1 {
    margin-bottom: 10px;
}

p {
    color: #aaa;
    margin-bottom: 30px;
}

a {
    display: block;
    width: 90%;
    max-width: 550px;
    margin: 15px auto;
    padding: 20px;
    background: #222;
    color: white;
    text-decoration: none;
    border-radius: 12px;
    font-size: 19px;
    font-weight: bold;
}

a:focus {
    outline: 4px solid #00aaff;
    transform: scale(1.03);
}
</style>
</head>

<body>

<h1>⚙️ Genie TV 설정 테스트</h1>
<p>TV Bro에서 하나씩 테스트하세요.</p>

<a href="intent://applications/#Intent;action=android.settings.APPLICATION_SETTINGS;end">
① 앱 설정 — APPLICATION_SETTINGS
</a>

<a href="intent://applications/#Intent;action=android.settings.MANAGE_APPLICATIONS_SETTINGS;end">
② 앱 설정 — MANAGE_APPLICATIONS_SETTINGS
</a>

<a href="intent://applications/#Intent;action=android.settings.MANAGE_ALL_APPLICATIONS_SETTINGS;end">
③ 전체 앱 — MANAGE_ALL_APPLICATIONS_SETTINGS
</a>

<a href="intent://settings/#Intent;action=android.settings.SETTINGS;end">
④ 전체 설정
</a>

</body>
</html>
