<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Android TV 앱 설정</title>
<style>
  body {
    font-family: sans-serif;
    text-align: center;
    padding: 60px 20px;
    background: #f5f5f5;
  }
  .box {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 35px 20px;
    border-radius: 18px;
  }
  a {
    display: inline-block;
    margin-top: 20px;
    padding: 18px 28px;
    background: #111;
    color: white;
    text-decoration: none;
    border-radius: 12px;
    font-size: 19px;
  }
</style>
</head>
<body>
<div class="box">
  <h2>Android TV 앱 설정</h2>
  <p>아래 버튼을 누르면 설치된 앱 목록을 엽니다.</p>

  <a href="intent:#Intent;action=android.settings.MANAGE_APPLICATIONS_SETTINGS;end">
    앱 목록 열기
  </a>
</div>
</body>
</html>
